spring.application.name=chubb
server.port=8080

spring.liquibase.change-log=classpath:db/changelog/master.xml

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/claim_db
spring.datasource.username=devbe
spring.datasource.password=devbe
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Embedded ActiveMQ for local development and coding tests
spring.activemq.in-memory=true
spring.activemq.broker-url=vm://embedded-broker-dev?broker.persistent=false
spring.activemq.packages.trust-all=true
spring.jms.template.default-destination=claim-events

# Local SMTP endpoint used by the rejected-assessment email listener
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Kafka is intentionally disabled here; enable it with --spring.profiles.active=kafka
